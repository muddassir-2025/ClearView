# ── Good Post backend (§41) ──────────────────────────────────────────────
# Base URL of the ClearView Good Post backend. Deliberately left EMPTY: an
# unconfigured build shows "Good Post is not set up in this build" rather than
# silently pointing at a developer machine or an expired tunnel, and no build
# can accidentally ship aimed at the wrong server.
#
# Nothing else in ClearView depends on this — the Quran, Media, Feed and Block
# tabs keep working with it unset, and with no account at all.
#
# Set it here (this file is committed; a public hostname is not a secret), or
# override for a single build:
#   ./gradlew assembleDebug -PgoodPostBaseUrl=https://your-service.onrender.com
#
# The P is capitalised and the name is exactly `goodPostBaseUrl`. Gradle property
# names are case-sensitive and an unknown one is ignored rather than refused, so
# a typo here builds happily and produces an app that claims no backend is
# configured. (Both spellings are read anyway, for that reason.)
#
# The Good Post backend's address. It must match the Render service's own
# hostname exactly. The deployed service is named `ClearView` in the Render
# dashboard, so Render assigned `clearview-1neb.onrender.com` — NOT the
# `clearview-goodpost-api` that server/render.yaml's Blueprint would have
# produced, because the service was created by hand rather than from the
# Blueprint. The dashboard name is the authority: read it off the service page
# and paste it here, or the app points at a host that does not answer, which
# reads as "the server is down" rather than as "this value is wrong".
#
# No trailing slash — GoodPostApi trims one anyway, but a trailing slash here
# would also survive into BuildConfig and make log output harder to read.
#
# A free Render instance spins down after 15 minutes idle and takes roughly a
# minute to wake, which is longer than the client's 15s read timeout. The first
# Good Post request after a pause can therefore report unreachable and succeed
# on the retry. Set it to https://clearview-goodpost-api.onrender.com once the
# service exists.
#
# Overridable per build without editing this file; -P wins over this value.
goodPostBaseUrl=https://clearview-1neb.onrender.com

# There is no goodPostContactEmail any more. The sign-in screen used to print the
# deployment owner's address for "I want channel access", and channel sign-up is
# now the Google/email form on that screen itself (§16) — so the property showed
# a private address in a public place for no reason. A support address belongs in
# a Help row in Settings; add it back there if it is wanted.

# The shortest password this app accepts for an administrator account it creates,
# and the number it names when it refuses one. It mirrors the server's
# ADMIN_MIN_PASSWORD_LENGTH, and the mirroring is deliberate: the floor is
# enforced by the backend, but a form that cannot say what it wants is how a
# correct-looking password gets refused three times in a row. Change both
# together; the server remains the authority.
adminMinPasswordLength=8