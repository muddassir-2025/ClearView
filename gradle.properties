# ── Good Post backend (§41) ──────────────────────────────────────────────
# Base URL of the ClearView Good Post backend. Deliberately left EMPTY: an
# unconfigured build shows "Good Post is not set up in this build" rather than
# silently pointing at a developer machine or an expired tunnel, and no build
# can accidentally ship aimed at the wrong server.
#
# Nothing else in ClearView depends on this — the Quran, Media, Feed and Block
# tabs keep working with it unset, and with no account at all.
#
# Set it here (this file is committed; a public hostname is not a secret), or
# override for a single build:
#   ./gradlew assembleDebug -PgoodPostBaseUrl=https://your-service.onrender.com
#
# The live backend. Verified reachable: /health 200 and /health/db 200 (db up).
# No trailing slash — GoodPostApi trims one anyway, but a trailing slash here
# would also survive into BuildConfig and make logs harder to read.
#
# This is a FREE Render instance: it spins down after 15 minutes idle and takes
# roughly a minute to wake, which is longer than the client's 15s read timeout.
# The first Good Post request after a pause can therefore report unreachable and
# succeed on the retry.
#
# Overridable per build without editing this file; -P wins over this value.
goodPostBaseUrl=https://clearview-1neb.onrender.com

# The address the administrator sign-in screen tells someone to write to (§16).
# Same reasoning as the base URL above: it belongs to the deployment, not to the
# source tree, and a hard-coded one is wrong for every installation but one.
#
# Left unset, the screen falls back to the placeholder in strings.xml.
# Overridable per build with -PgoodPostContactEmail=…
goodPostContactEmail=studymuddassir@gmail.com