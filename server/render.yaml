# Render Blueprint — ClearView Good Post backend.
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
#
# `rootDir: server` is essential: the repository root is the Android project,
# and the backend lives in this subdirectory.
#
# Region `frankfurt` is deliberate. Neon and the S3 bucket are both in AWS
# eu-central-1 (see the S3 block at the bottom), so putting the service in the
# same region keeps database round trips — of which every request makes at
# least one — on the same continent as both.

services:
  - type: web
    name: clearview-goodpost-api
    runtime: node
    # ── Free instance, and what it costs you ─────────────────────────────
    # `free` spins the service down after 15 minutes with no inbound traffic,
    # and the next request pays a cold start of roughly a MINUTE (Render shows
    # a loading page to browsers; a native client just sees a slow socket).
    #
    # It also removes Shell access and pre-deploy commands, which are paid-only
    # features — so on this plan migrations are run from YOUR MACHINE, not from
    # Render. That is not a workaround: Neon is external to Render either way,
    # and `npm run migrate` already applies them under a session advisory lock
    # with checksums, so it is safe to re-run.
    #
    # Render's own documentation says "Do not use them for production
    # applications" of Free instances. This is fine for development and for
    # testing the Android app against a real backend; move to `starter` before
    # anyone else depends on it.
    #
    # To go back to paid: set plan: starter and restore the preDeployCommand
    # shown in the comment below.
    plan: free
    region: frankfurt
    branch: main
    rootDir: server
    # `--include=dev` is NOT optional decoration — without it this build fails.
    #
    # The build needs `typescript` plus `@types/express`, `@types/cors` and
    # `@types/pg`, and all four are devDependencies (correctly: they are
    # build-time tooling, not runtime deps). A plain `npm ci` omits them when
    # the install runs in production mode, which is what `NODE_ENV=production`
    # on this service turns on. The symptom is not "tsc: not found" but a wall
    # of TS7016 errors — "Could not find a declaration file for module
    # 'express'" — because the type packages are absent while the compiled JS
    # they annotate is there.
    #
    # Verified before changing this: package.json, package-lock.json and
    # tsconfig.json were identical between a build that worked and one that
    # did not, with the same Node version. The only variable was the
    # environment, so the flag is made explicit rather than inferred.
    buildCommand: npm ci --include=dev && npm run build
    # REMOVED FOR THE FREE PLAN. A pre-deploy command is a paid feature
    # ("available for paid web services, private services, and background
    # workers"), and leaving an unsupported key in a Blueprint is not something
    # to leave lying around. Restore it together with plan: starter:
    #
    #   preDeployCommand: npm run migrate:prod
    #
    # When restored, note that it connects over DATABASE_URL_DIRECT and not
    # DATABASE_URL: a transaction pooler can route the statements of one
    # migration to different backends, which breaks both DDL and session-level
    # advisory locks. Migration files are immutable and checksummed and each
    # runs in its own transaction, so re-running one is a safe no-op.
    startCommand: npm start
    healthCheckPath: /health
    # `autoDeploy: true` still works but is deprecated; this is its replacement.
    autoDeployTrigger: commit
    envVars:
      # ── Fixed ────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      # Do NOT set PORT — Render injects it and the app reads it.

      # ── Secrets Render generates, so nobody has to invent them ────────
      #
      # Exactly two, because exactly two are read. In production src/env.ts
      # refuses to boot on a placeholder value, or on a JWT_SECRET or
      # GOODPOST_HASH_PEPPER shorter than 32 characters.
      #
      # `generateValue` means no human ever writes them down or pastes them
      # anywhere they could leak, and it is idempotent: a redeploy keeps the
      # value it already generated rather than rotating it out from under live
      # sessions.
      #
      # NOT listed, because nothing reads them: JWT_REFRESH_SECRET,
      # ACCESS_TOKEN_TTL, REFRESH_TOKEN_TTL_DAYS and
      # DEFAULT_NOTIFICATIONS_ENABLED. An administrator's refresh token is a row
      # with its own expiry, so there is no second secret and no token lifetime to
      # configure outside the database.
      - key: JWT_SECRET
        generateValue: true
      - key: GOODPOST_HASH_PEPPER
        generateValue: true

      # ── You must supply these (Render prompts once, then stores them) ──
      # `sync: false` means the value is NOT in git.
      #
      # Neon → Dashboard → Connection string:
      #   the pooled host (contains "-pooler") → DATABASE_URL
      #   the direct host (no "-pooler")       → DATABASE_URL_DIRECT
      #
      # DATABASE_URL is required at boot. DATABASE_URL_DIRECT is only read by
      # the migration runner, so on the free plan — where migrations run from
      # your machine — this can be left empty in the Render dashboard. It is
      # listed because the paid path needs it for pre-deploy.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false

      # Your Render service URL, e.g. https://clearview-goodpost-api.onrender.com
      # Set this AFTER the first deploy, once Render has assigned the hostname.
      #
      # It is not cosmetic: it is the base of every channel's `shareLink`, which
      # the API hands to the app and the app hands to whatever the user shares
      # with. A wrong value produces links that point somewhere that does not
      # exist, silently. Copy the hostname Render shows on the service page and
      # paste it here in full, including `https://`.
      - key: PUBLIC_BASE_URL
        sync: false

      # The one account that can publish at all (§17).
      #
      # There is no route that creates the first administrator — an
      # unauthenticated "create the first admin" endpoint is a backdoor, not a
      # bootstrap — so this is provisioned from the environment at boot.
      #
      # SUPER_ADMIN_PASSWORD_HASH is a bcrypt hash. Generate one with:
      #   node -e "console.log(require('bcryptjs').hashSync(process.argv[1], 12))" 'secret'
      # It is stored as-is; re-hashing it would hash the hash and the password
      # would not work. SUPER_ADMIN_PASSWORD is accepted as an alternative and
      # hashed once, so a deployment holding only a plaintext secret still works.
      #
      # Once this account exists it is never overwritten from here: a redeploy
      # must not undo a password rotation made in the app.
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD_HASH
        sync: false
      - key: SUPER_ADMIN_DISPLAY_NAME
        value: Good Post Admin

      # Shown by the app's "Don't have channel access?" line (§16). Public, and
      # the deployment's own address rather than ours.
      - key: ADMIN_CONTACT_EMAIL
        sync: false

      # ── Non-secret tuning, safe in git ────────────────────────────────
      # How long a DELETED post's rows survive before the physical delete. Zero:
      # a channel's history is kept until somebody deletes it, and a post that HAS
      # been deleted stops being readable immediately, so a grace period would only
      # keep content an administrator already removed.
      #
      # (There used to be a GOODPOST_HISTORY_DAYS here, expiring a channel's posts
      # on a schedule. Nothing read it: a broadcast channel's history is its
      # product, and the sweep that used it was removed.)
      - key: PURGE_GRACE_DAYS
        value: 0
      # The administrator sign-in budget: a ten-minute access token and a
      # seven-day session, both refreshed rather than re-typed.
      - key: ADMIN_ACCESS_TOKEN_TTL
        value: 10m
      - key: ADMIN_SESSION_TTL_DAYS
        value: 7
      - key: ADMIN_MIN_PASSWORD_LENGTH
        value: 12
      - key: RETENTION_JOB_ENABLED
        value: true
      - key: RETENTION_CRON
        value: '*/30 * * * *'

      # ── Amazon S3, for channel and post images ─────────────────────────
      #
      # Image posts are part of the product, so these are listed rather than left
      # to be discovered: with no bucket configured the service still runs
      # (src/env.ts defaults AWS_REGION and an empty bucket), but every upload
      # answers `media_unavailable` and the composer says so. Add all four to
      # turn images on.
      #
      # SERVER-SIDE ONLY. These never reach the Android app: the client asks the
      # backend for a short-lived presigned URL and PUTs the bytes straight to the
      # bucket. The architecture is Android → backend → Neon/S3, never Android →
      # S3 with a permanent key.
      #
      # The policy the access key needs — PutObject, DeleteObject, GetObject and a
      # scoped ListBucket — is written out in docs/AWS_S3_SETUP.md, with
      # docs/aws-s3-policy.json as the exact document to attach.
      - key: AWS_REGION
        value: eu-central-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # ── Deliberately ABSENT, and why ──────────────────────────────────
      #
      # CORS_ORIGINS — the Android client sends no Origin header, so it needs
      #   no CORS at all. src/app.ts already refuses browsers outright when this
      #   is empty, which is the correct posture for an app-only client. Never
      #   "*".
      #
      # AWS_USE_INSTANCE_ROLE — only for infrastructure that injects credentials
      #   through an instance profile. Render does not, so the two keys above are
      #   the way in. Setting it here would make the SDK look for a role that
      #   never arrives and media would fail with a much worse error than
      #   `media_unavailable`.
      #
      # PHONE_VERIFY_MODE / FIREBASE_* / EMAIL_* / OTP_* — gone with the modules
      #   they configured. Good Post has no viewer accounts, so there is no phone
      #   verification, no email sign-in code and no push token to register. The
      #   only credential in the product is an administrator's.
      #
      # RATE_LIMIT_MAX / AUTH_RATE_LIMIT_MAX — left to their code defaults on
      #   purpose rather than duplicated here, so there is one source of truth.
      #   The effective values are printed at boot by describeActiveLimits().
      #   Add them in the Render dashboard to tune a limit without a deploy.
