# Render Blueprint — ClearView Good Post backend (§41).
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
#
# `rootDir: server` is essential: the repository root is the Android project,
# and the backend lives in this subdirectory.
#
# Region `frankfurt` is deliberate. Neon is in AWS eu-central-1 and S3 will be
# too (M3), so putting the service in the same region keeps database round
# trips — of which every authenticated request makes one — on the same
# continent as both.

services:
  - type: web
    name: clearview-goodpost-api
    runtime: node
    # ── Free instance, and what it costs you ─────────────────────────────
    # `free` spins the service down after 15 minutes with no inbound traffic,
    # and the next request pays a cold start of roughly a MINUTE (Render shows
    # a loading page to browsers; a native client just sees a slow socket).
    #
    # It also removes Shell access and pre-deploy commands, which are paid-only
    # features — so on this plan migrations are run from YOUR MACHINE, not from
    # Render. That is not a workaround: Neon is external to Render either way,
    # and `npm run migrate` already applies them under a session advisory lock
    # with checksums, so it is safe to re-run.
    #
    # Render's own documentation says "Do not use them for production
    # applications" of Free instances. This is fine for development and for
    # testing the Android app against a real backend; move to `starter` before
    # anyone else depends on it.
    #
    # To go back to paid: set plan: starter and restore the preDeployCommand
    # shown in the comment below.
    plan: free
    region: frankfurt
    branch: main
    rootDir: server
    # `--include=dev` is NOT optional decoration — without it this build fails.
    #
    # The build needs `typescript` plus `@types/express`, `@types/cors` and
    # `@types/pg`, and all four are devDependencies (correctly: they are
    # build-time tooling, not runtime deps). A plain `npm ci` omits them when
    # the install runs in production mode, which is what `NODE_ENV=production`
    # on this service turns on. The symptom is not "tsc: not found" but a wall
    # of TS7016 errors — "Could not find a declaration file for module
    # 'express'" — because the type packages are absent while the compiled JS
    # they annotate is there.
    #
    # Verified before changing this: package.json, package-lock.json and
    # tsconfig.json were identical between a build that worked and one that
    # did not, with the same Node version. The only variable was the
    # environment, so the flag is made explicit rather than inferred.
    buildCommand: npm ci --include=dev && npm run build
    # REMOVED FOR THE FREE PLAN. A pre-deploy command is a paid feature
    # ("available for paid web services, private services, and background
    # workers"), and leaving an unsupported key in a Blueprint is not something
    # to leave lying around. Restore it together with plan: starter:
    #
    #   preDeployCommand: npm run migrate:prod
    #
    # When restored, note that it connects over DATABASE_URL_DIRECT and not
    # DATABASE_URL: a transaction pooler can route the statements of one
    # migration to different backends, which breaks both DDL and session-level
    # advisory locks. Migration files are immutable and checksummed and each
    # runs in its own transaction, so re-running one is a safe no-op.
    startCommand: npm start
    healthCheckPath: /health
    # `autoDeploy: true` still works but is deprecated; this is its replacement.
    autoDeployTrigger: commit
    envVars:
      # ── Fixed ────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      # Do NOT set PORT — Render injects it and the app reads it.

      # ── Secrets Render generates, so nobody has to invent them ────────
      # In production src/env.ts refuses to boot on a placeholder, a short
      # value, or JWT_SECRET == JWT_REFRESH_SECRET — so these must be real and
      # distinct. generateValue guarantees that, and means no human ever
      # writes them down or pastes them anywhere they could leak.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PHONE_HASH_PEPPER
        generateValue: true

      # ── You must supply these (Render prompts once, then stores them) ──
      # `sync: false` means the value is NOT in git.
      #
      # Neon → Dashboard → Connection string:
      #   the pooled host (contains "-pooler") → DATABASE_URL
      #   the direct host (no "-pooler")       → DATABASE_URL_DIRECT
      #
      # DATABASE_URL is required at boot. DATABASE_URL_DIRECT is only read by
      # the migration runner, so on the free plan — where migrations run from
      # your machine — this can be left empty in the Render dashboard. It is
      # listed because the paid path needs it for pre-deploy.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false

      # Your Render service URL, e.g. https://clearview-goodpost-api.onrender.com
      # Set this AFTER the first deploy, once Render has assigned the hostname.
      # It only feeds shareable links (§6), which arrive in M2, so a placeholder
      # here does not break anything today.
      - key: PUBLIC_BASE_URL
        sync: false

      # Firebase Admin service account (Firebase → Project settings →
      # Service accounts → Generate new private key). All three are REQUIRED:
      # production refuses to boot with PHONE_VERIFY_MODE=firebase and no
      # credentials, because phone sign-in would otherwise be unable to verify
      # any token.
      #
      # FIREBASE_PRIVATE_KEY must keep its `\n` escapes on a single line. The
      # helper in scripts/set-firebase-env.mjs produces exactly that.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

      # Email sign-in — the second method for entering Good Post.
      #
      # Two routes, and the mode is deliberately NOT pinned here: setting it in
      # this file would let a blueprint sync silently revert a working choice
      # back to one that cannot deliver. Set it in the dashboard.
      #
      #   smtp    → send through an authenticated mailbox (Gmail + an app
      #             password). Reaches ANY recipient with no domain to own.
      #             Costs the account's daily limit and reputation.
      #   resend  → a provider API. Needs a sending domain VERIFIED in Resend;
      #             `onboarding@resend.dev` only reaches your own address, which
      #             is not a production value.
      #   console → refused in production by src/env.ts: it writes live sign-in
      #             codes into the process log.
      #   disabled (default) → the endpoint answers `email_unavailable` and
      #             everything else keeps working.
      #
      # Whichever is chosen, a half-configured deployment is already safe:
      # src/email/sender.ts uses the provider only when its credentials are
      # present, and otherwise answers `email_unavailable` on that one endpoint.
      # In production src/env.ts refuses to boot on a chosen-but-unconfigured
      # mode, so the mistake surfaces at deploy time rather than at sign-in.
      #
      # Steps for both routes: docs/EMAIL_SETUP.md.
      - key: EMAIL_DELIVERY_MODE
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Only read when EMAIL_DELIVERY_MODE=smtp. SMTP_PASS is a Gmail APP
      # PASSWORD (16 characters), never the account password.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # ── Non-secret tuning, safe in git ────────────────────────────────
      - key: GOODPOST_HISTORY_DAYS
        value: 90
      - key: PURGE_GRACE_DAYS
        value: 30
      # §19. env.ts refuses `false` in production; keeping it here makes the
      # enforcement visible in the dashboard rather than implied by a default.
      - key: BAN_PHONE_ENFORCED
        value: true
      - key: PHONE_VERIFY_MODE
        value: firebase
      - key: FCM_ENABLED
        value: true
      - key: RETENTION_JOB_ENABLED
        value: true
      - key: RETENTION_CRON
        value: '*/30 * * * *'

      # ── Deliberately ABSENT, and why ──────────────────────────────────
      #
      # CORS_ORIGINS — the Android client sends no Origin header, so it needs
      #   no CORS at all. src/app.ts already refuses browsers outright when
      #   this is empty, which is the correct posture until a browser client
      #   exists. The admin dashboard's real origin goes here in M6. Never "*".
      #
      # EMAIL_OTP_TTL_MINUTES / EMAIL_OTP_MAX_SENDS_PER_HOUR /
      #   EMAIL_OTP_MAX_ATTEMPTS — same reasoning as the rate limits below:
      #   they have code defaults (10 / 5 / 5) and belong in the dashboard if
      #   you want to tune them, not duplicated here.
      #
      # AWS_* — the media code is written (M3) but the credentials are not
      #   supplied yet, so the variables stay absent and the service keeps
      #   working: src/env.ts defaults AWS_REGION to eu-central-1 with an empty
      #   bucket, and uploads answer `media_unavailable` until both
      #   AWS_S3_BUCKET and AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (or
      #   AWS_USE_INSTANCE_ROLE) are set. Add all four to enable media.
      #
      # RATE_LIMIT_MAX / AUTH_RATE_LIMIT_MAX — left to their code defaults on
      #   purpose rather than duplicated here, so there is one source of truth.
      #   The effective values are printed at boot by describeActiveLimits().
      #   Add them in the Render dashboard to tune a limit without a deploy.
